name: openclaw-plugin-release

# Runs after openclaw-plugin-validate succeeds on a push to main. If package.json
# carries a version that hasn't been released yet, and the top CHANGELOG section
# is for that version, tag the validated commit, create the GitHub release, and
# publish the plugin to ClawHub.
#
# Tag and release are created here rather than by a tag-triggered workflow:
# a tag pushed with GITHUB_TOKEN does not trigger other workflows.

on:
  workflow_run:
    workflows: [openclaw-plugin-validate]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: openclaw-plugin-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and create GitHub release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      released: ${{ steps.version.outputs.release }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check for an unreleased version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version agents/openclaw/plugin/package.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=agents/openclaw/plugin/package.json::version '$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          TAG="zerogpu-openclaw-plugin--v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $VERSION is already released ($TAG). Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=true"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CHANGELOG="agents/openclaw/CHANGELOG.md"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # The newest (top) section must be the version being released.
          LATEST=$(awk '/^## /{print $2; exit}' "$CHANGELOG")
          if [ "$LATEST" != "$VERSION" ]; then
            echo "::error file=$CHANGELOG::Latest CHANGELOG section is '## $LATEST' but package.json is $VERSION. Not releasing."
            exit 1
          fi

          # Grab lines from `## <version>` (exclusive) up to the next `## ` heading (exclusive),
          # then strip leading/trailing blank lines. Write directly to a file so the notes
          # never round-trip through shell interpolation.
          awk -v ver="$VERSION" '
            $0 ~ "^## +" ver "( |$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' "$CHANGELOG" \
            | awk 'NF{found=1} found{print}' \
            | awk '{lines[NR]=$0} END{n=NR; while(n>0 && lines[n]==""){n--}; for(i=1;i<=n;i++) print lines[i]}' \
            > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error file=$CHANGELOG::'## $VERSION' section in $CHANGELOG is empty"
            exit 1
          fi

          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Create and push tag
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            # Left over from a run that pushed the tag but failed to create the release.
            echo "Tag $TAG already exists on origin; reusing it."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898800+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "zerogpu-openclaw-plugin $VERSION"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "zerogpu-openclaw-plugin $VERSION" \
            --notes-file "$NOTES_FILE" \
            --verify-tag

  publish:
    name: Publish plugin to ClawHub
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build plugin
        run: |
          cd agents/openclaw/plugin
          npm ci
          npm run build

      - name: Publish plugin package to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes clawhub@latest login --token "$CLAWHUB_TOKEN"
          npx --yes clawhub@latest package publish agents/openclaw/plugin \
            --family code-plugin --owner zerogpu --dry-run
          npx --yes clawhub@latest package publish agents/openclaw/plugin \
            --family code-plugin --owner zerogpu
