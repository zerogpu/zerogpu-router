name: claude-plugin-release

on:
  push:
    tags:
      - 'claude-v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#claude-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match expected pattern 'claude-v<version>'"
            exit 1
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify plugin.json version matches tag
        run: |
          set -euo pipefail
          PLUGIN_VERSION=$(jq -r .version agents/claude/.claude-plugin/plugin.json)
          if [ "$PLUGIN_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error file=agents/claude/.claude-plugin/plugin.json::plugin.json version ($PLUGIN_VERSION) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Extract CHANGELOG section
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG="agents/claude/CHANGELOG.md"

          # Grab lines from `## <version>` (exclusive) up to the next `## ` heading (exclusive).
          notes=$(awk -v ver="$VERSION" '
            $0 ~ "^## +" ver "( |$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' "$CHANGELOG")

          # Trim leading/trailing blank lines.
          notes=$(printf '%s\n' "$notes" | awk 'NF{found=1} found{print}' | awk '{lines[NR]=$0} END{n=NR; while(n>0 && lines[n]==""){n--}; for(i=1;i<=n;i++) print lines[i]}')

          if [ -z "$notes" ]; then
            echo "::error file=$CHANGELOG::No '## $VERSION' section found in $CHANGELOG"
            exit 1
          fi

          {
            echo "notes<<__RELEASE_NOTES_EOF__"
            echo "$notes"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "zerogpu-router ${{ steps.version.outputs.version }}" \
            --notes "${{ steps.notes.outputs.notes }}" \
            --verify-tag
