name: claude-plugin-validate

on:
  pull_request:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'agents/claude/**'
      - '.github/workflows/claude-plugin-validate.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'agents/claude/**'

concurrency:
  group: claude-plugin-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketplace and plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Print versions (debug)
        run: |
          node --version
          claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate plugin (agents/claude)
        run: claude plugin validate ./agents/claude

      - name: Check CHANGELOG.md updated
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "$BASE_REF"

          CHANGELOG="agents/claude/CHANGELOG.md"

          # Only enforce when plugin files (excluding the changelog itself) changed.
          if git diff --quiet "origin/$BASE_REF" -- "agents/claude/" ":(exclude)$CHANGELOG"; then
            echo "No plugin changes under agents/claude/ — CHANGELOG update not required."
            exit 0
          fi

          if git diff --quiet "origin/$BASE_REF" -- "$CHANGELOG"; then
            echo "::error file=$CHANGELOG::Plugin files changed but $CHANGELOG was not updated. Add a '## <next-version>' section describing what shipped — ./claude-release bumps plugin.json at release time."
            exit 1
          fi

          echo "CHANGELOG.md updated."
