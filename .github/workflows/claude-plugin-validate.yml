name: claude-plugin-validate

on:
  pull_request:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'agents/claude/**'
      - '!agents/claude/CHANGELOG.md'
      - '.github/workflows/claude-plugin-validate.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'agents/claude/**'
      - '!agents/claude/CHANGELOG.md'

concurrency:
  group: claude-plugin-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate marketplace and plugin
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Print versions (debug)
        run: |
          node --version
          claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate plugin (agents/claude)
        run: claude plugin validate ./agents/claude
