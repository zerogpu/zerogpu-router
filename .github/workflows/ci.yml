name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  openclaw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agents/openclaw/plugin
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run

  claude-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate Claude marketplace + plugin manifests
        run: |
          for f in .claude-plugin/marketplace.json agents/claude/.claude-plugin/plugin.json agents/claude/plugins/zerogpu-router/.claude-plugin/plugin.json; do
            echo "Validating $f"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
