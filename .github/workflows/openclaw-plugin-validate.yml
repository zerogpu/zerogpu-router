name: openclaw-plugin-validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/openclaw/**'
      - '.github/workflows/openclaw-plugin-validate.yml'

  push:
    branches: [main]
    paths:
     - 'agents/openclaw/**'

concurrency:
   group: openclaw-plugin-validate-${{ github.ref }}
   cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenClaw plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
    
      - name: Install dependencies
        run: |
          cd agents/openclaw/plugin
          npm ci
    
      - name: Build plugin
        run: |
          cd agents/openclaw/plugin
          npm run build
    
      - name: Validate package contents
        run: |
          cd agents/openclaw/plugin
          npm pack --dry-run
    
      - name: Check CHANGELOG updated
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
    
          CHANGELOG="agents/openclaw/CHANGELOG.md"
    
          if git diff --quiet "origin/$BASE_REF" -- "agents/openclaw/" ":(exclude)$CHANGELOG"; then
            echo "No plugin changes — CHANGELOG update not required."
            exit 0
          fi
    
          if git diff --quiet "origin/$BASE_REF" -- "$CHANGELOG"; then
            echo "::error file=$CHANGELOG::OpenClaw plugin changed but CHANGELOG not updated."
            exit 1
          fi
    
          echo "CHANGELOG updated."