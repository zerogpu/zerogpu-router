name: openclaw-plugin-validate

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/openclaw/**'
      - '.github/workflows/openclaw-plugin-validate.yml'

  push:
    branches: [main]
    paths:
     - 'agents/openclaw/**'

concurrency:
   group: openclaw-plugin-validate-${{ github.ref }}
   cancel-in-progress: true

jobs:
  validate:
    name: Validate OpenClaw plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
    
      - name: Install dependencies
        run: |
          cd agents/openclaw/plugin
          npm ci
    
      - name: Build plugin
        run: |
          cd agents/openclaw/plugin
          npm run build
    
      - name: Validate package contents
        run: |
          cd agents/openclaw/plugin
          npm pack --dry-run

      - name: Ensure jq is installed
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Check version consistency
        run: |
          set -euo pipefail
          PKG_VERSION=$(jq -r .version agents/openclaw/plugin/package.json)
          PLUGIN_VERSION=$(jq -r .version agents/openclaw/plugin/openclaw.plugin.json)
          LOCK_VERSION=$(jq -r '.version' agents/openclaw/plugin/package-lock.json)
          LOCK_ROOT_VERSION=$(jq -r '.packages[""].version' agents/openclaw/plugin/package-lock.json)

          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version mismatch: package.json ($PKG_VERSION) vs openclaw.plugin.json ($PLUGIN_VERSION)"
            exit 1
          fi
          if [ "$PKG_VERSION" != "$LOCK_VERSION" ] || [ "$PKG_VERSION" != "$LOCK_ROOT_VERSION" ]; then
            echo "::error file=agents/openclaw/plugin/package-lock.json::Version mismatch: package.json ($PKG_VERSION) vs package-lock.json ($LOCK_VERSION / $LOCK_ROOT_VERSION). Run: npm --prefix agents/openclaw/plugin install --package-lock-only"
            exit 1
          fi

      - name: Check for bundled skill name collisions
        run: |
          set -euo pipefail
          cd agents/openclaw/plugin

          # OpenClaw ships its own bundled skills. A plugin skill sharing a name
          # with one of them never loads, silently — this is how `summarize` was
          # dead for every user until 4.2.0. Fail the build instead.
          COLLISIONS=$(comm -12 \
            <(ls skills | sort) \
            <(ls node_modules/openclaw/skills | sort))

          if [ -n "$COLLISIONS" ]; then
            echo "::error::Plugin skills collide with OpenClaw bundled skills: $(echo "$COLLISIONS" | tr '\n' ' ')"
            echo "Rename the skill (directory, SKILL.md name:, and openclaw.plugin.json entry)."
            exit 1
          fi

          echo "No collisions with $(ls node_modules/openclaw/skills | wc -l) bundled skills."

      - name: Check skill manifest matches disk
        run: |
          set -euo pipefail
          cd agents/openclaw/plugin

          # A rename has to land in three places. If the manifest, the directory,
          # and the SKILL.md `name:` disagree, the skill loads wrong or not at all.
          STATUS=0
          for ENTRY in $(jq -r '.skills[]' openclaw.plugin.json); do
            DIR="${ENTRY#./}"
            if [ ! -f "$DIR/SKILL.md" ]; then
              echo "::error::openclaw.plugin.json lists $ENTRY but $DIR/SKILL.md does not exist"
              STATUS=1
              continue
            fi
            DECLARED=$(sed -n 's/^name: *//p' "$DIR/SKILL.md" | head -1)
            if [ "$DECLARED" != "$(basename "$DIR")" ]; then
              echo "::error file=$DIR/SKILL.md::name: is '$DECLARED' but the directory is '$(basename "$DIR")'"
              STATUS=1
            fi
          done

          for DIR in skills/*/; do
            NAME=$(basename "$DIR")
            if ! jq -e --arg s "./skills/$NAME" '.skills | index($s)' openclaw.plugin.json > /dev/null; then
              echo "::error::skills/$NAME exists on disk but is not listed in openclaw.plugin.json"
              STATUS=1
            fi
          done

          exit $STATUS

      - name: Verify build output
        run: |
          test -f agents/openclaw/plugin/dist/index.js || (echo "Missing build output" && exit 1)
    
      # Merging a plugin change releases it, so the PR must carry the bump and
      # the matching changelog section that openclaw-plugin-release requires.
      - name: Check version bump and CHANGELOG
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          PKG="agents/openclaw/plugin/package.json"
          CHANGELOG="agents/openclaw/CHANGELOG.md"
          git fetch --no-tags --depth=1 origin "$BASE_REF"

          # Compare commits, not the working tree, so build output doesn't count.
          if git diff --quiet "origin/$BASE_REF" HEAD -- agents/openclaw/ ":(exclude)$CHANGELOG"; then
            echo "No plugin changes — version bump not required."
            exit 0
          fi

          OLD=$(git show "origin/$BASE_REF:$PKG" | jq -r .version)
          NEW=$(jq -r .version "$PKG")
          if ! [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=$PKG::version '$NEW' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [ "$NEW" = "$OLD" ] || [ "$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)" != "$NEW" ]; then
            echo "::error file=$PKG::Plugin changed but version was not bumped ($BASE_REF has $OLD, this PR has $NEW). Bump version in package.json, openclaw.plugin.json, and package-lock.json."
            exit 1
          fi

          LATEST=$(awk '/^## /{print $2; exit}' "$CHANGELOG")
          if [ "$LATEST" != "$NEW" ]; then
            echo "::error file=$CHANGELOG::Top CHANGELOG section is '## $LATEST'. Add a '## $NEW' section at the top describing this release."
            exit 1
          fi

          echo "Version $OLD -> $NEW with a matching CHANGELOG section."