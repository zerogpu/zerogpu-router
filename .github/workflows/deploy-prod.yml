name: Deploy to Cloudflare (production)

on:
  release:
    types: [published]

defaults:
  run:
    working-directory: mcp-example/plugins/zerogpu/mcp-servers/zerogpu-mcp

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Deploy to Production
        run: npx wrangler deploy --env production

      - name: Push Worker secrets
        env:
          ZEROGPU_ORCHESTRATION_URL: ${{ secrets.ZEROGPU_ORCHESTRATION_URL }}
        run: |
          printf '%s' "$ZEROGPU_ORCHESTRATION_URL" \
            | npx wrangler secret put ZEROGPU_ORCHESTRATION_URL --env production
