name: Deploy to Cloudflare (staging)

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: mcp-server

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Node server
        run: npm run build

      - name: Type-check Worker
        run: npm run worker:types

      - name: Run Tests
        run: npm test

      # KV (ZEROGPU_CONFIG) is seeded once, out-of-band, via `npm run kv:seed:staging`.
      # Re-seed manually only when config/catalog.json changes — not on every deploy.

      - name: Deploy to Staging
        run: npx wrangler deploy --env staging

      - name: Push Worker secrets
        env:
          ZEROGPU_ORCHESTRATION_URL: ${{ secrets.ZEROGPU_ORCHESTRATION_URL }}
        run: |
          printf '%s' "$ZEROGPU_ORCHESTRATION_URL" \
            | npx wrangler secret put ZEROGPU_ORCHESTRATION_URL --env staging
