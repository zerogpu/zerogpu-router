# ZeroGPU MCP - Cloudflare Worker
# Top-level block is the "local" profile used by `wrangler dev` and bare `wrangler deploy`.
# Deployable environments are develop / staging / production below.
#
# Durable Object hibernation:
#   The ZeroGpuMcp DO extends agents/mcp's McpAgent, which implements the
#   WebSocket Hibernation API (webSocketMessage / webSocketClose lifecycle hooks).
#   Combined with the `new_sqlite_classes` migration, the runtime will hibernate
#   the DO when idle and only bill for active CPU time on incoming events.
#
# Model catalog / tool specs / pricing:
#   Not hardcoded. Served from the ZEROGPU_CONFIG KV namespace under key `catalog`.
#   Seed once per environment with `npm run kv:seed:<env>` (run manually, not on
#   every deploy). Re-seed only when config/catalog.json actually changes.
name = "zerogpu-mcp"
main = "src/worker.ts"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_compat"]

[vars]
ZEROGPU_MCP_ENV = "local"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "ZeroGpuMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ZeroGpuMcp"]

[[kv_namespaces]]
binding = "ZEROGPU_CONFIG"
id = "local-placeholder"
preview_id = "local-placeholder-preview"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true


# ------------------------------------------------------------------------------
# develop — auto-deployed from pushes to `dev`
# ------------------------------------------------------------------------------
[env.develop]
name = "zerogpu-mcp-develop"

[env.develop.vars]
ZEROGPU_MCP_ENV = "develop"

[[env.develop.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "ZeroGpuMcp"

[[env.develop.migrations]]
tag = "v1"
new_sqlite_classes = ["ZeroGpuMcp"]

[[env.develop.kv_namespaces]]
binding = "ZEROGPU_CONFIG"
# Replace with the develop KV namespace id. Create it with:
#   npx wrangler kv namespace create ZEROGPU_CONFIG --env develop
id = "d23694f9d0ca47d4addfcef8183916d8"


# ------------------------------------------------------------------------------
# staging — auto-deployed from pushes to `main`
# ------------------------------------------------------------------------------
[env.staging]
name = "zerogpu-mcp-staging"

[env.staging.vars]
ZEROGPU_MCP_ENV = "staging"

[[env.staging.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "ZeroGpuMcp"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["ZeroGpuMcp"]

[[env.staging.kv_namespaces]]
binding = "ZEROGPU_CONFIG"
# Replace with the staging KV namespace id. Create it with:
#   npx wrangler kv namespace create ZEROGPU_CONFIG --env staging
id = "8fb3306c1a644e1eb643c4fc6e3b35f7"


# ------------------------------------------------------------------------------
# production — deployed on GitHub release publish
# ------------------------------------------------------------------------------
[env.production]
name = "zerogpu-mcp"

[env.production.vars]
ZEROGPU_MCP_ENV = "production"

[[env.production.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "ZeroGpuMcp"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["ZeroGpuMcp"]

[[env.production.kv_namespaces]]
binding = "ZEROGPU_CONFIG"
# Replace with the production KV namespace id. Create it with:
#   npx wrangler kv namespace create ZEROGPU_CONFIG --env production
id = "5a788a052fe74a94ab63d4fecbf06255"
